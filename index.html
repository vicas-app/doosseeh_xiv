    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              serif: ['Playfair Display', 'serif'],
              sans: ['Plus Jakarta Sans', 'sans-serif'],
            },
          },
        },
      }
    </script>
    <style>
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #ffffff;
        overflow-x: hidden;
        transition: background-color 0.5s ease, color 0.5s ease;
      }
      .dark body {
        background-color: #0a0a0a;
        color: #f5f5f5;
      }
      h1, h2, h3, .font-serif {
        font-family: 'Playfair Display', serif;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-up {
        animation: fadeUp 0.8s ease-out forwards;
      }
      
      /* Splash Screen Animations */
      @keyframes letter-reveal {
        from { opacity: 0; transform: translateY(30px); filter: blur(10px); }
        to { opacity: 1; transform: translateY(0); filter: blur(0); }
      }
      .animate-letter {
        display: inline-block;
        animation: letter-reveal 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        opacity: 0;
      }
      
      @keyframes logo-entrance {
        from { opacity: 0; transform: scale(0.8) translateY(-20px); filter: brightness(0); }
        to { opacity: 1; transform: scale(1) translateY(0); filter: brightness(1); }
      }
      .animate-logo-splash {
        animation: logo-entrance 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }

      @keyframes splash-exit {
        0% { transform: translateY(0); }
        100% { transform: translateY(-100%); }
      }
      .exit-splash {
        animation: splash-exit 1s cubic-bezier(0.77, 0, 0.175, 1) forwards;
      }

      /* Logo filters */
      .logo-filter-light {
        filter: invert(1) contrast(200%);
        mix-blend-mode: multiply;
      }
      .logo-filter-dark {
        mix-blend-mode: screen;
      }
      
      * {
        transition-property: background-color, border-color, color, fill, stroke;
        transition-duration: 0.5s;
        transition-timing-function: ease;
      }
    </style>
